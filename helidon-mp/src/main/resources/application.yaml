server:
  port: 8080
javax:
  sql:
    DataSource:
      fruits:
        dataSourceClassName: org.postgresql.ds.PGSimpleDataSource
        dataSource:
          url: jdbc:postgresql://localhost:5432/fruits
          user: fruits
          password: fruits
        maximumPoolSize: 50
otel:
  sdk:
    disabled: false
  service:
    name: helidon-mp
  traces:
    sampler: parentbased_traceidratio
    sampler.arg: 0.1
    exporter: otlp
  exporter:
    otlp:
      protocol: http/protobuf
      endpoint: http://localhost:4318
  metrics:
    exporter: none
  logs:
    exporter: none
telemetry:
  span:
    name-includes-method: true
